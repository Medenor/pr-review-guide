<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · PromptVault #130</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>/* Layout: sticky top bar with tabs; one centred column per tab; the walkthrough splits into
   steps (left) and a sticky code panel (right); the diff tab adds a file rail on wide screens. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef1f5; --line: #dde2e9; --line-strong: #c4ccd8;
  --fg: #18202b; --fg-2: #4a5566; --fg-3: #6f7a8b;
  --accent: #1f5fd1; --accent-soft: #e4ecfb; --accent-fg: #ffffff;
  --add-bg: #e7f6ea; --add-strong: #b8e6c1; --add-fg: #176b2c;
  --del-bg: #fcebec; --del-strong: #f5c1c5; --del-fg: #a3202c;
  --hl: #fff4c7; --hl-edge: #e0a400;
  --ok: #1b7f3b; --ok-bg: #e3f4e8; --warn: #9a6100; --warn-bg: #fbf0d9; --bad: #b42331; --bad-bg: #fbe6e8;
  --info: #4a5566; --info-bg: #eceff4;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .05);
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #161d26; --surface-2: #1d2631; --line: #283342; --line-strong: #3a4757;
    --fg: #e6ebf2; --fg-2: #a9b4c4; --fg-3: #7d899b;
    --accent: #6f9cff; --accent-soft: #1c2a44; --accent-fg: #0b1220;
    --add-bg: #12301d; --add-strong: #1f5a33; --add-fg: #7ddc97;
    --del-bg: #3a171c; --del-strong: #6b2630; --del-fg: #ff9aa4;
    --hl: #3a3215; --hl-edge: #e0b13a;
    --ok: #6fd58d; --ok-bg: #143021; --warn: #f0b955; --warn-bg: #352a12; --bad: #ff8691; --bad-bg: #3a1820;
    --info: #a9b4c4; --info-bg: #222c38;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d26; --surface-2: #1d2631; --line: #283342; --line-strong: #3a4757;
  --fg: #e6ebf2; --fg-2: #a9b4c4; --fg-3: #7d899b;
  --accent: #6f9cff; --accent-soft: #1c2a44; --accent-fg: #0b1220;
  --add-bg: #12301d; --add-strong: #1f5a33; --add-fg: #7ddc97;
  --del-bg: #3a171c; --del-strong: #6b2630; --del-fg: #ff9aa4;
  --hl: #3a3215; --hl-edge: #e0b13a;
  --ok: #6fd58d; --ok-bg: #143021; --warn: #f0b955; --warn-bg: #352a12; --bad: #ff8691; --bad-bg: #3a1820;
  --info: #a9b4c4; --info-bg: #222c38;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font-body); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono, .code, pre, textarea { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
code, .mono { font-family: var(--font-mono); font-size: .88em; }
p code, li code, td code, .md code { background: var(--surface-2); padding: .08em .35em; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.25; text-wrap: balance; margin: 0; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1320px; margin: 0 auto; display: flex; align-items: center; gap: 16px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { font: 600 .95rem var(--font-head); color: var(--fg); white-space: nowrap; }
.brand span { color: var(--fg-3); font-weight: 500; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.tabs a { padding: 6px 12px; border-radius: 8px; color: var(--fg-2); font-weight: 500; font-size: .92rem; white-space: nowrap; }
.tabs a:hover { background: var(--surface-2); text-decoration: none; }
.tabs a.active { background: var(--accent-soft); color: var(--accent); }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; flex: none; }

main { max-width: 1320px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
.narrow { max-width: 920px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 28px; }
.foot { text-align: center; color: var(--fg-3); font-size: .8rem; padding: 0 16px 32px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.muted { color: var(--fg-2); }
.small { font-size: .85rem; }
.md p { margin: 0 0 .7em; }
.md p:last-child { margin-bottom: 0; }
.md ul { margin: .2em 0 .7em; padding-left: 1.2em; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.mine { font-size: .7rem; color: var(--fg-3); border: 1px dashed var(--line-strong); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 2px 9px;
  border-radius: 999px; background: var(--info-bg); color: var(--info); white-space: nowrap; line-height: 1.6; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }

/* warnings banner */
#warnings .banner { max-width: 1320px; margin: 12px auto 0; padding: 0 16px; }
#warnings details { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 14px; font-size: .88rem; }
#warnings ul { margin: 6px 0 2px; padding-left: 1.2em; }

/* summary */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--fg-2); font-size: .9rem; }
.verdict { border-left: 5px solid var(--accent); display: grid; gap: 10px; }
.verdict.approve { border-left-color: var(--ok); }
.verdict.approve-with-nits { border-left-color: var(--ok); }
.verdict.request-changes { border-left-color: var(--bad); }
.verdict.needs-discussion { border-left-color: var(--warn); }
.verdict .headline { font: 600 1.3rem/1.35 var(--font-head); }
.verdict-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat .v { font: 600 1.35rem var(--font-head); font-variant-numeric: tabular-nums; }
.stat .l { font-size: .8rem; color: var(--fg-2); }
.stat .n { font-size: .75rem; color: var(--fg-3); }
.v .add { color: var(--add-fg); } .v .del { color: var(--del-fg); }
.compo-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); margin: 8px 0 10px; }
.compo-bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--fg-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.two-col > * { min-width: 0; }
.claims { width: 100%; border-collapse: collapse; font-size: .9rem; }
.claims td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.claims td:first-child { width: 120px; }
.claims .ev { color: var(--fg-2); font-size: .85rem; margin-top: 4px; }
.qlist { margin: 0; padding-left: 1.2em; }
.qlist li { margin-bottom: 6px; }
.ci-list { display: flex; flex-wrap: wrap; gap: 6px; }
.linked { display: grid; gap: 8px; }
.linked a { display: flex; gap: 8px; align-items: baseline; color: var(--fg); }
.linked .num { color: var(--fg-3); font-family: var(--font-mono); font-size: .85rem; }

/* walkthrough */
.walk { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: start; }
.steps { display: flex; flex-direction: column; gap: 18px; padding-bottom: 45vh; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  transition: border-color .2s, box-shadow .2s, background .2s; cursor: pointer; }
.step.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); box-shadow: var(--shadow); }
.step-num { font: 600 .78rem var(--font-mono); color: var(--accent); }
.step h3 { margin: 4px 0 6px; font-size: 1.08rem; }
.step .where { font-family: var(--font-mono); font-size: .75rem; color: var(--fg-3); margin-top: 8px; word-break: break-all; }
details.more { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
details.more summary { cursor: pointer; color: var(--accent); font-size: .87rem; font-weight: 500; }
details.more .md { margin-top: 8px; font-size: .92rem; }
.panel { position: sticky; top: 72px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100vh - 96px); overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.panel-head .path { font: 600 .82rem var(--font-mono); word-break: break-all; flex: 1; min-width: 0; }
.panel-body { overflow: auto; flex: 1; scroll-behavior: smooth; }
.excerpt { display: none; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.progress { height: 3px; background: var(--surface-2); }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s; }

/* code lines */
.code { font: 12.5px/1.55 var(--font-mono); }
.hunk-head { background: var(--accent-soft); color: var(--fg-2); padding: 3px 12px; font-size: 12px; position: sticky; left: 0; }
.ln { display: grid; grid-template-columns: 44px 44px 18px minmax(0, 1fr); transition: opacity .25s, background .25s; }
.ln .no { color: var(--fg-3); text-align: right; padding-right: 8px; user-select: none; font-size: 11.5px; }
.ln .sig { color: var(--fg-3); user-select: none; text-align: center; }
.ln code { white-space: pre-wrap; word-break: break-word; font-size: inherit; background: none; padding: 0 12px 0 0; }
.ln.add { background: var(--add-bg); } .ln.add .sig { color: var(--add-fg); }
.ln.del { background: var(--del-bg); } .ln.del .sig { color: var(--del-fg); }
.ln ins { background: var(--add-strong); text-decoration: none; border-radius: 2px; }
.ln del { background: var(--del-strong); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--del-fg) 50%, transparent); border-radius: 2px; }
.code.focus .ln { opacity: .38; }
.code.focus .ln.hl { opacity: 1; box-shadow: inset 3px 0 0 var(--hl-edge); }
.code.focus .ln.hl:not(.add):not(.del) { background: var(--hl); }
.ln.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: inset 4px 0 0 var(--hl-edge); background: var(--hl); } }
.gap-row { color: var(--fg-3); font-size: 11.5px; padding: 2px 12px; background: var(--surface-2); font-style: italic; }

/* map */
.reading { display: flex; flex-direction: column; gap: 0; }
.ro { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 4px; border-top: 1px solid var(--line); }
.ro:first-child { border-top: none; }
.ro-n { font: 600 .9rem var(--font-mono); color: var(--fg-3); text-align: right; padding-top: 2px; }
.ro .path { font: 600 .85rem var(--font-mono); word-break: break-all; }
.ro.skip { opacity: .65; }
.ro-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: .8rem; font-variant-numeric: tabular-nums; }
.diagram { overflow-x: auto; }
.diagram .mermaid-src { white-space: pre; font: 12px/1.5 var(--font-mono); color: var(--fg-2); background: var(--surface-2); padding: 12px; border-radius: 8px; }
.diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }

/* risks + checklist */
.risk { border-left: 4px solid var(--line-strong); display: grid; gap: 6px; }
.risk.high { border-left-color: var(--bad); } .risk.medium { border-left-color: var(--warn); } .risk.low { border-left-color: var(--fg-3); }
.risk .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.risk .catch { font-size: .87rem; color: var(--fg-2); }
.check-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.check-item:first-of-type { border-top: none; }
.check-item input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.check-item.done .txt { color: var(--fg-3); text-decoration: line-through; }
.meter { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--ok); transition: width .3s; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); cursor: pointer; font-weight: 500; font-size: .88rem; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
textarea.notes { width: 100%; min-height: 180px; font: 12.5px/1.5 var(--font-mono); background: var(--surface-2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 10px; }
.reflink { font-family: var(--font-mono); font-size: .78rem; cursor: pointer; }

/* learn */
.concepts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.concept h3 { font-family: var(--font-mono); font-size: .98rem; }
.concept .short { color: var(--fg-2); font-size: .9rem; margin: 4px 0 10px; }
.try-select { display: block; width: 100%; margin: 4px 0 12px; padding: 8px 10px; font: 13px var(--font-mono); background: var(--surface-2); color: var(--fg); border: 1px solid var(--line-strong); border-radius: 8px; }
.try-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 8px; }
.try-cell { border-radius: 8px; padding: 10px 12px; min-width: 0; }
.try-cell.del { background: var(--del-bg); } .try-cell.add { background: var(--add-bg); }
.try-cell code { display: block; margin-top: 4px; white-space: pre-wrap; word-break: break-all; background: none; padding: 0; }
.quiz-q { display: grid; gap: 10px; }
.quiz-opts { display: grid; gap: 8px; }
.quiz-opt { text-align: left; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); }
.quiz-opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.quiz-opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.quiz-opt:disabled { cursor: default; }
.quiz-explain { font-size: .9rem; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.score { font: 600 1rem var(--font-head); }

/* diff */
.diff-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { position: sticky; top: 72px; max-height: calc(100vh - 96px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
.rail a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--fg); font-size: .8rem; }
.rail a:hover { background: var(--surface-2); text-decoration: none; }
.rail a .p { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail a.viewed { opacity: .5; }
.rail .nums { font-variant-numeric: tabular-nums; font-size: .75rem; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.file { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
.file.viewed { opacity: .6; }
.file-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; cursor: pointer; }
.file-head .path { font: 600 .84rem var(--font-mono); word-break: break-all; flex: 1; min-width: 0; }
.file-head .tw { width: 14px; color: var(--fg-3); transition: transform .2s; }
.file.open .file-head .tw { transform: rotate(90deg); }
.file-note { padding: 8px 14px; font-size: .87rem; color: var(--fg-2); border-bottom: 1px solid var(--line); }
.file-body { overflow-x: auto; }
.nums .add { color: var(--add-fg); } .nums .del { color: var(--del-fg); }
label.viewed-box { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--fg-2); cursor: pointer; }

@media (max-width: 960px) {
  .walk { grid-template-columns: minmax(0, 1fr); }
  .panel { display: none; }
  .excerpt { display: block; }
  .steps { padding-bottom: 0; }
  .diff-layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .two-col { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .brand { display: none; }
  .ln { grid-template-columns: 38px 16px minmax(0, 1fr); }
  .ln .no.o { display: none; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

main, .tab, .steps, .step, .narrow { min-width: 0; }
.step, .card { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#summary" id="brand"></a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#summary" data-tab="summary">Summary</a>
      <a href="#walkthrough" data-tab="walkthrough">Walkthrough</a>
      <a href="#map" data-tab="map">Map</a>
      <a href="#risks" data-tab="risks">Risks &amp; checklist</a>
      <a href="#learn" data-tab="learn">Learn</a>
      <a href="#diff" data-tab="diff">Diff</a>
    </nav>
    <button class="icon-btn" id="theme-btn" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
  </div>
</header>
<div id="warnings"></div>
<main>
  <section id="tab-summary" class="tab" data-tab="summary"></section>
  <section id="tab-walkthrough" class="tab" data-tab="walkthrough" hidden></section>
  <section id="tab-map" class="tab" data-tab="map" hidden></section>
  <section id="tab-risks" class="tab" data-tab="risks" hidden></section>
  <section id="tab-learn" class="tab" data-tab="learn" hidden></section>
  <section id="tab-diff" class="tab" data-tab="diff" hidden></section>

<script type="application/json" id="data">{"pr": {"repo": "Medenor/PromptVault", "number": 130, "title": "feat(db): move to psycopg v3 and run PostgreSQL tests in CI", "url": "https://github.com/Medenor/PromptVault/pull/130", "author": "Medenor", "state": "merged", "base": "main", "head": "feat/psycopg3-and-postgres-ci", "base_sha": "e0f35519b5802c93e955224404a690b359aab6ae", "head_sha": "981786b4273d46d8fea946a0f23c2eee93805b21", "created_at": "2026-11-24T16:56:40Z", "merged_at": "2026-11-24T17:16:33Z", "closed_at": "2026-11-24T17:16:33Z", "body": "Refs #127. Stacked on #128 (base is that branch, so the diff shows only this change; GitHub retargets to `main` once #128 merges).\n\nRefs #127. Builds on #128 (merged as e0f3551), which pinned psycopg2 as the 1.16.1 hotfix; this replaces that pin with psycopg v3.\n\n1. **PostgreSQL driver: psycopg2 to psycopg v3.** `psycopg2-binary` is replaced by `psycopg[binary]` (SQLAlchemy 2.1's default driver), and `uv.lock` is regenerated (only the two driver packages change). `DatabaseSettings.sqlalchemy_url` makes a bare `postgresql://` explicit as `postgresql+psycopg://` and maps the legacy `postgresql+psycopg2://` to it, so existing `.env` files keep working with no edit. `pg_dump`/`psql` still get a plain URI through `libpq_url`.\n2. **PostgreSQL tests in CI.** New `test-postgres` job with a `postgres:15-alpine` service, running `make test-postgres`. It includes the real `pg_dump`/`psql` backup round trip, which is skipped on machines without those tools. This is the check that would have caught #126. The job is not a required check yet.\n3. **`make test-postgres`** runs each PostgreSQL test file as its own pytest process and resets the database between files. The migration tests leave tables behind, which broke later files when run in one session (`search_vector already exists`). The reset script drops and recreates the `public` schema, so it refuses unless the database name contains `test`.\n4. **Test helper fix:** `test_migration_prompt_legacy_public.py` read `cursor.lastrowid`, which psycopg v3 lacks. It now uses `RETURNING id`.\n\n## Verified\n\n- All 9 PostgreSQL test files pass against a real PostgreSQL 15 on psycopg 3.3.9 (FTS search and snippets, FTS migration, skill search, both skill/prompt migrations, backup round trip: 61 passed, 1 skipped: the `pg_dump` round trip, no client tools locally).\n- Built the real image (`python:3.15-slim`) and ran the Alembic upgrade in it against a fresh PostgreSQL 15 database: a bare `postgresql://` URL migrated it to head (23 tables), and the legacy `postgresql+psycopg2://` URL also connected. The app's own `engine` connects through the `psycopg` driver. A cp315 binary wheel exists, so the image needs no compiler for it.\n- `tests/test_db_url_driver.py` updated (15 tests), including a check that the resolved driver's DBAPI actually imports.\n- black, ruff and mypy are clean.\n\n## Notes for reviewers\n\n- Existing deployments need no `DATABASE_URL` change. The `gcc` line in the Dockerfile is left as is; it can be dropped separately once nothing else needs a compiler.\n- Possible behavior difference: psycopg v3 binds parameters server-side and is stricter about types than psycopg2. The 6 raw `text()` queries and the FTS queries are exercised by the PostgreSQL tests above and passed.\n- PgBouncer in transaction mode would need `prepare_threshold=None`; PromptVault does not configure a pooler.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nhttps://claude.ai/code/session_01Vs1Ap9DnWqtdrgXWBiFgBv\n", "labels": [], "agent_written": true, "agent_evidence": ["PR body names an AI coding tool", "commits co-authored by an AI agent"], "commits": [{"sha": "981786b4273d46d8fea946a0f23c2eee93805b21", "headline": "feat(db): move PostgreSQL driver to psycopg v3 and run PostgreSQL tes…", "authors": ["Medenor", "claude"], "agent": true}], "checks": [{"name": "changes", "workflow": "CI", "result": "success", "url": "https://github.com/Medenor/PromptVault/actions/runs/45444743298/job/138625281027"}, {"name": "lint", "workflow": "CI", "result": "success", "url": "https://github.com/Medenor/PromptVault/actions/runs/45444743298/job/138625281269"}, {"name": "test", "workflow": "CI", "result": "success", "url": "https://github.com/Medenor/PromptVault/actions/runs/45444743298/job/138625280683"}, {"name": "test-postgres", "workflow": "CI", "result": "success", "url": "https://github.com/Medenor/PromptVault/actions/runs/45444743298/job/138625281098"}], "reviews": [], "comment_count": 0, "linked_issues": [{"number": 127, "title": "chore(db): migrate PostgreSQL driver from psycopg2 to psycopg v3", "state": "closed", "kind": "issue", "url": "https://github.com/Medenor/PromptVault/issues/127", "body": "## Context\n\nThe PostgreSQL driver regression (#126) is fixed short-term by pinning `psycopg2`. SQLAlchemy 2.1 made **psycopg v3** its default PostgreSQL driver, so the project now runs on the non-default driver.\n\n## Proposal (later, not urgent)\n\nMove to `psycopg[binary]` (v3):\n\n- replace `psycopg2-binary` in `pyproject.toml` / `uv.lock`\n- make `sqlalchemy_url` default a bare `postgresql://` to `postgresql+psycopg://` (or stop rewriting it)\n- check pool / `pool_pre_ping` behavior, `scripts/setup/` generated URLs, the APScheduler job store and Alembic\n- test against a real PostgreSQL 15 in CI (the suite currently runs only on SQLite, which is how the regression went unnoticed)\n- document the upgrade for existing deployments (URLs with an explicit `+psycopg2` need changing)\n"}, {"number": 128, "title": "fix(db): pin bare postgresql:// URLs to psycopg2 under SQLAlchemy 2.1", "state": "closed", "kind": "pull request", "url": "https://github.com/Medenor/PromptVault/pull/128", "body": "Closes #126\n\n## Problem\n\nSQLAlchemy 2.1 (bumped by #86) resolves a bare `postgresql://` URL to the psycopg v3 dialect, but only `psycopg2-binary` is installed. Every PostgreSQL deployment crashed at import with `No module named 'psycopg'` (web server and Alembic). The test suite runs on SQLite, so CI did not notice.\n\n## Fix\n\n`DATABASE_URL` is left as the user wrote it. `DatabaseSettings` gains two derived views:\n\n- `sqlalchemy_url`: a bare `postgresql://` becomes `postgresql+psycopg2://`; a URL with an explicit driver is unchanged. Used by the engine (`src/db/session.py`), Alembic (`alembic/env.py`) and the APScheduler job store.\n- `libpq_url`: any `+driver` suffix is removed. Used by `pg_dump` / `psql`, because libpq rejects `postgresql+psycopg2://`. This also keeps backups working for anyone who applied the `+psycopg2` workaround in `DATABASE_URL`.\n\nNo configuration change is needed. SQLite is unaffected. Moving to psycopg v3 is tracked in #127.\n\n## Tests\n\n- New `tests/test_db_url_driver.py` (15 tests): resolved dialect driver, explicit drivers and SQLite untouched, `DATABASE_URL` not rewritten, libpq view, and `pg_dump` / `psql` receiving the plain URI. 13 of the 15 fail without the fix.\n- Verified a real `create_engine(sqlalchemy_url)` loads `psycopg2`.\n- Full backend suite: 2831 passed, 41 skipped. 4 `test_template_snapshots` cases fail identically on clean `origin/main` in a fresh worktree because the built frontend (`static/dist`) is absent there, so they are an enviro"}, {"number": 126, "title": "fix(db): bare postgresql:// resolves to psycopg v3 under SQLAlchemy 2.1; web crash-loops on PostgreSQL", "state": "closed", "kind": "issue", "url": "https://github.com/Medenor/PromptVault/issues/126", "body": "## Problem\n\nSince #86 (Dependabot group bump, 2026-11-20) SQLAlchemy is `>=2.1.9,<2.2`. SQLAlchemy 2.1 resolves a bare `postgresql://` URL to the **psycopg v3** dialect, but the project only ships `psycopg2-binary`. Every PostgreSQL deployment built from `main` (including v1.16.0) fails at import:\n\n```\nFile \".../sqlalchemy/dialects/postgresql/psycopg.py\", line 497, in import_dbapi\n    import psycopg\nModuleNotFoundError: No module named 'psycopg'. Did you mean: 'psycopg2'?\n```\n\nThe `web` container crash-loops and the Alembic upgrade command fails the same way. CI did not catch it because the test suite runs on SQLite.\n\nVerified in the built image: `make_url(\"postgresql://u:p@h/d\").get_dialect().driver == \"psycopg\"`.\n\n## Affected\n\nAll PostgreSQL deployments using a plain `postgresql://` URL (the default in `docker-compose.yml`, `.env.example` and every URL generated by `scripts/setup/`) on builds after #86, including 1.16.0. SQLite is unaffected.\n\n## Workaround\n\nSet `DATABASE_URL=postgresql+psycopg2://...`. Caveat: `PostgresDumpStrategy` passes `DATABASE_URL` to `pg_dump`/`psql`, and libpq rejects a `+driver` URI, so backups break with this workaround until the fix below ships.\n\n## Proposed fix\n\nKeep `DATABASE_URL` as the user wrote it and expose two derived views on `DatabaseSettings`:\n\n- `sqlalchemy_url`: bare `postgresql://` becomes `postgresql+psycopg2://`; an explicit driver is left alone. Used by `src/db/session.py`, `alembic/env.py` and the APScheduler job store.\n- `libp"}], "diff_source": "GitHub API (gh pr diff)", "additions": 199, "deletions": 58, "read_minutes": 7, "files": [{"path": ".github/workflows/ci.yml", "old_path": null, "status": "modified", "binary": false, "hunks": [{"old_start": 127, "old_lines": 3, "new_start": 127, "new_lines": 50, "context": "jobs:", "lines": [[" ", 127, 127, ""], [" ", 128, 128, "      - name: Test"], [" ", 129, 129, "        run: make test"], ["+", null, 130, ""], ["+", null, 131, "  # The `test` job runs on SQLite, so a PostgreSQL-only regression (wrong driver,"], ["+", null, 132, "  # dialect-specific SQL, pg_dump/psql backups) passes it unnoticed. This job runs the"], ["+", null, 133, "  # PostgreSQL legs of the suite against a real server. Not a required check yet."], ["+", null, 134, "  test-postgres:"], ["+", null, 135, "    name: test-postgres"], ["+", null, 136, "    if: github.event_name != 'pull_request' || github.event.pull_request.draft !  `RecursionError`, so `/api/auth/refresh`, `/api/auth/logout` and the 2FA challenge exchange answered an unauthenticated request with a server error instead of a 401 (GHSA-8wjv-2p76-3863, GHSA-42vr-xj54-vc7v). The other PyJWT advisories fixed in these releases concern HMAC keys, `PyJWK` and `PyJWKClient`, which PromptVault does not use (it only accepts ES256 tokens)."], [" ", 13, 13, "- **Tokens sent in a request body are capped at 4096 characters** on those three endpoints, so oversized input is rejected with a 422 before it reaches the token parser."], [" ", 14, 14, ""], ["+", null, 15, "### Changed"], ["+", null, 16, ""], ["+", null, 17, "- **PostgreSQL driver moved from psycopg2 to psycopg v3** (#127): the image now installs `psycopg[binary]`, SQLAlchemy's default driver since 2.1. A `DATABASE_URL` that says `postgresql://` or the older `postgresql+psycopg2://` keeps working unchanged; both are loaded with psycopg v3. SQLite is unaffected."], ["+", null, 18, "- **CI now runs the PostgreSQL tests** against a real `postgres:15` server (`test-postgres` job, `make test-postgres`): full-text search, the migrations and the `pg_dump`/`psql` backup round trip, which previously only ran on SQLite. This is the check that would have caught #126."], ["+", null, 19, ""], [" ", 15, 20, "### Fixed"], [" ", 16, 21, ""], [" ", 17, 22, "- **PostgreSQL deployments crashed at startup with `No module named 'psycopg'`** (#126): since the SQLAlchemy 2.1 upgrade (#86) a plain `postgresql://` URL loads the psycopg v3 driver, but PromptVault ships psycopg2. The web server, Alembic and the backup job store now pin a bare `postgresql://` URL to `postgresql+psycopg2://`; a URL that names a driver is used as written. `pg_dump` and `psql` still receive a plain `postgresql://` URI, so backups keep working with either form. No change to `DATABASE_URL` is needed. SQLite is unaffected. Moving to psycopg v3 is tracked in #127."]]}], "additions": 5, "deletions": 0, "truncated": false, "category": "docs", "github_url": "https://github.com/Medenor/PromptVault/pull/130/files#diff-2bfab3db5cc1baf4c6d3ff6b19901926e3bdf4411ec685dac973e5fcff1c723b", "read_minutes": 0.1}, {"path": "docs/TESTING.md", "old_path": null, "status": "modified", "binary": false, "hunks": [{"old_start": 710, "old_lines": 7, "new_start": 710, "new_lines": 7, "context": "Skills have their own suites. Archives are built in memory by `tests/fixtures/sk", "lines": [[" ", 710, 710, ""], [" ", 711, 711, "Optional legs, each skipped with a reason when its prerequisite is missing:"], [" ", 712, 712, ""], ["-", 713, null, "- **PostgreSQL**: set `TEST_DATABASE_URL` (or `DATABASE_URL`) to a throwaway PostgreSQL database, never a database you care about. The migration, full-text search and `pg_dump` round-trip tests then run against it. `pg_dump` and `psql` must be on `PATH` for the backup test."], ["+", null, 713, "- **PostgreSQL**: set `TEST_DATABASE_URL` (or `DATABASE_URL`) to a throwaway PostgreSQL database, never a database you care about. The migration, full-text search and `pg_dump` round-trip tests then run against it. `pg_dump` and `psql` must be on `PATH` for the backup test. `make test-postgres` runs every file with a PostgreSQL leg, one file at a time, resetting the database between files because the migration tests leave tables behind. It drops and recreates the `public` schema, so it refuses to run unless the database name contains `test` (for example `postgresql://postgres:pw@localhost:5432/promptvault_test`). CI runs it in the `test-postgres` job against a `postgres:15` service."], [" ", 714, 714, "- **Reference validator (SC-008)**: install the Agent Skills `skills-ref` tool and put it on `PATH`. `tests/unit/test_skill_archive_writer.py` then checks that an exported, warning-free archive passes `skills-ref validate`."], [" ", 715, 715, "- **Reference corpus (SC-004)**: `tests/integration/test_skill_reference_corpus.py` is marked `network`. It downloads a pinned snapshot of `anthropics/sk l": "https://github.com/Medenor/PromptVault/pull/130/files#diff-84321598744d84dbee2318e634c74c9aae39a1c253f1c4bd17ebf9ef2f807b11", "read_minutes": 0}]}, "analysis": {"verdict": {"recommendation": "approve-with-nits", "headline": "Safe swap to psycopg v3: old `.env` URLs keep working, and PostgreSQL finally runs in CI", "why": "The driver change is contained in one property, `sqlalchemy_url`, and its tests cover bare, legacy and other URLs. The new `test-postgres` CI job passed on this PR, which is the check that would have caught #126.\n\nThe nits are operational: the new job is not a required check, and it pins Python 3.14 while the Docker image uses 3.15.", "confidence": "medium", "confidence_note": "Raw SQL under psycopg v3's stricter typing is covered only by the 9 PostgreSQL test files; code paths outside them were not exercised."}, "summary": {"tldr": "SQLAlchemy 2.1 started choosing psycopg v3 for plain `postgresql://` URLs, while PromptVault shipped psycopg2, so the web app crash-looped on PostgreSQL (#126). #128 patched that by forcing psycopg2. This PR goes the other way: it installs psycopg v3, rewrites old URLs to it, and adds a CI job that runs the PostgreSQL tests against a real database.", "why": "#126 shipped because CI only ever ran on SQLite. #127 asked to move to the driver SQLAlchemy now expects instead of pinning the old one.", "what_changed": ["The app talks to PostgreSQL through **psycopg v3** instead of psycopg2.", "`DATABASE_URL` values written as `postgresql://` or `postgresql+psycopg2://` are rewritten to `postgresql+psycopg://`; nobody has to edit their `.env`.", "A new CI job, `test-postgres`, runs 9 PostgreSQL test files against PostgreSQL 15 on every PR.", "`make test-postgres` runs those files one by one and wipes the test schema between them."], "impact": "Deployments pull a new driver on the next image build; no config change. Contributors get a new CI job (not blocking yet).", "key_numbers": [{"label": "PostgreSQL test files in CI", "value": "9", "note": "from PG_TEST_FILES in the Makefile"}]}, "claims": [{"claim": "Existing `.env` files keep working with no edit.", "status": "verified", "evidence": "`_PSYCOPG_REWRITE_RE` matches both the bare and the `+psycopg2` prefix, and `test_legacy_psycopg2_url_is_mapped_to_psycopg3` asserts the rewrite.", "ref": {"file": "src/db/config.py", "side": "new", "start": 85, "end": 87}}, {"claim": "uv.lock is regenerated; only the two driver packages change.", "status": "partly", "evidence": "The lock swaps psycopg2-binary for psycopg and psycopg-binary, and also bumps the lockfile format from `revision = 3` to `revision = 5`, which the description doesn't mention. Harmless: CI and the Docker build install with pip.", "ref": {"file": "uv.lock", "side": "new", "start": 2, "end": 2}}, {"claim": "All 9 PostgreSQL test files pass against a real PostgreSQL 15 (61 passed, 1 skipped).", "status": "verified", "evidence": "The author's local numbers are not checkable, but the `test-postgres` CI job, which runs the same 9 files on postgres:15-alpine, passed on this PR's head."}, {"claim": "The reset script refuses unless the database name contains `test`.", "status": "verified", "evidence": "It parses the URL and returns 2 before connecting when the name lacks `test`.", "ref": {"file": "scripts/reset_test_postgres.py", "side": "new", "start": 33, "end": 38}}, {"claim": "Built the real image (python:3.15-slim) and ran the Alembic upgrade in it.", "status": "unverified", "evidence": "Nothing in the diff or CI builds the image; this rests on the author's word."}, {"claim": "Stacked on #128 (base is that branch; GitHub retargets to `main` once #128 merges).", "status": "contradicted", "evidence": "The PR's base is `main` and #128 was already merged (the body's own second paragraph says so). The first paragraph is left over from an earlier iteration."}], "story": [{"title": "The dependency swap", "body": "One line in `pyproject.toml` replaces **psycopg2**, the long-standing PostgreSQL driver, with **psycopg v3** (package `psycopg`). `[binary]` pulls a precompiled wheel, so no C compiler is needed.", "ref": {"file": "pyproject.toml", "side": "new", "start": 34, "end": 34}}, {"title": "The old pin, removed", "body": "Before, any bare `postgresql://` URL was forced onto psycopg2. That pin was #128's hotfix for #126.", "ref": {"file": "src/db/config.py", "side": "old", "start": 81, "end": 82}, "more_title": "Why the pin existed", "more": "SQLAlchemy 2.1 resolves a URL without a driver (`postgresql://`) to psycopg v3. With only psycopg2 installed, the import failed at startup and the container restarted forever."}, {"title": "One regex for both old URL forms", "body": "`_PSYCOPG_REWRITE_RE` matches `postgresql://` and `postgresql+psycopg2://`. Everything after the scheme is kept as is.", "ref": {"file": "src/db/config.py", "side": "new", "start": 28, "end": 31}, "more_title": "Which URLs are left alone", "more": "- `postgresql+psycopg://` and `postgresql+asyncpg://` already name a driver\n- `sqlite:///…` is not PostgreSQL\n- The regex is anchored with `^`, so a password containing `postgresql://` is not touched"}, {"title": "The rewrite itself", "body": "`sqlalchemy_url` swaps the matched prefix for `postgresql+psycopg://`. `DATABASE_URL` itself is never modified, so `libpq_url` (used for `pg_dump`) still sees the original.", "ref": {"file": "src/db/config.py", "side": "new", "start": 85, "end": 88}}, {"title": "Tests pin the new behaviour", "body": "The driver tests now expect psycopg v3, check the legacy mapping, and import the resolved driver for real, which is exactly how #126 failed.", "ref": {"file": "tests/test_db_url_driver.py", "side": "new", "start": 32, "end": 41}}, {"title": "A psycopg v3 difference, caught by a test", "body": "psycopg v3 doesn't fill `cursor.lastrowid` on PostgreSQL, so a test helper now asks for the id with `RETURNING id`.", "ref": {"file": "tests/test_migration_prompt_legacy_public.py", "side": "new", "start": 56, "end": 60}}, {"title": "PostgreSQL in CI at last", "body": "The new `test-postgres` job starts a PostgreSQL 15 service and runs `make test-postgres`. It is not a required check yet.", "ref": {"file": ".github/workflows/ci.yml", "side": "new", "start": 134, "end": 154}, "more_title": "How the Makefile isolates test files", "more": "Each file runs in its own pytest process, and `scripts/reset_test_postgres.py` drops and recreates the `public` schema in between. Migration tests leave tables behind (`search_vector already exists`), which broke later files in a shared session."}], "diagrams": [{"title": "Which driver a DATABASE_URL reaches", "caption": "Both old forms now converge on psycopg v3; URLs that already name another driver pass through.", "mermaid": "flowchart LR\n  A[\"postgresql://\"] --> R{rewrite regex}\n  B[\"postgresql+psycopg2://\"] --> R\n  R --> P[\"postgresql+psycopg://\"]\n  C[\"postgresql+asyncpg://\"] --> U[unchanged]\n  D[\"sqlite:///\"] --> U\n  P --> V[psycopg v3]"}, {"title": "make test-postgres", "caption": "Each file gets a fresh schema, so leftovers from migration tests can't leak.", "mermaid": "sequenceDiagram\n  participant M as make\n  participant R as reset script\n  participant DB as PostgreSQL\n  participant T as pytest\n  loop each of 9 files\n    M->>R: reset\n    R->>DB: DROP and CREATE SCHEMA\n    M->>T: run one file\n    T->>DB: queries\n  end"}], "reading_order": [{"file": "pyproject.toml", "attention": "glance", "why": "The dependency swap everything else follows from."}, {"file": "src/db/config.py", "attention": "read", "why": "The only production code change: how URLs map to a driver."}, {"file": "tests/test_db_url_driver.py", "attention": "read", "why": "Pins the URL mapping, including the legacy form."}, {"file": "tests/test_migration_prompt_legacy_public.py", "attention": "glance", "why": "A small psycopg v3 compatibility fix."}, {"file": "scripts/reset_test_postgres.py", "attention": "read", "why": "Destructive: check the safety guard."}, {"file": "Makefile", "attention": "read", "why": "How the PostgreSQL tests are run, file by file."}, {"file": ".github/workflows/ci.yml", "attention": "read", "why": "The new CI job and its database service."}, {"file": "docs/TESTING.md", "attention": "glance", "why": "Points readers at the new make target."}, {"file": "docs/CHANGELOG.md", "attention": "glance", "why": "Release note."}, {"file": "uv.lock", "attention": "skip", "why": "Generated; the driver packages are the only real change."}], "file_notes": {"src/db/config.py": "Rewrites bare and legacy PostgreSQL URLs to the psycopg v3 driver.", "scripts/reset_test_postgres.py": "Wipes the test database's schema between test files; refuses non-test databases.", "Makefile": "Adds `make test-postgres`, which runs each PostgreSQL test file in isolation.", ".github/workflows/ci.yml": "New non-blocking CI job against a real PostgreSQL 15."}, "risks": [{"title": "Stricter parameter typing in raw SQL", "severity": "medium", "detail": "psycopg v3 binds parameters server-side, so a raw `text()` query that passed a string where PostgreSQL expects an integer (or the reverse) can now fail at runtime where psycopg2 coerced it silently.", "catch": "The 9 PostgreSQL test files cover the FTS and migration queries; any raw SQL outside them is unchecked."}, {"title": "Docs promise a variable the make target ignores", "severity": "low", "detail": "`docs/TESTING.md` says to set `TEST_DATABASE_URL` (or `DATABASE_URL`), but `make test-postgres` only checks `DATABASE_URL` (Makefile line 173). Someone following the docs with only `TEST_DATABASE_URL` set gets the 'Set DATABASE_URL' error.", "catch": "Either read `TEST_DATABASE_URL` in the target or drop it from the docs.", "ref": {"file": "docs/TESTING.md", "side": "new", "start": 713, "end": 713}}, {"title": "The new CI job can be ignored", "severity": "low", "detail": "`test-postgres` is not a required check, so a red run would not block a merge: the same gap that let #126 through.", "catch": "Make it required in branch protection once it has been stable for a few PRs.", "ref": {"file": ".github/workflows/ci.yml", "side": "new", "start": 131, "end": 133}}, {"title": "CI Python differs from the image", "severity": "low", "detail": "The job installs Python 3.14; the Docker image is python:3.15-slim. A wheel or behaviour difference between them would not show in CI.", "ref": {"file": ".github/workflows/ci.yml", "side": "new", "start": 162, "end": 162}}], "checklist": [{"item": "Confirm the `test-postgres` job really ran the backup round trip (not skipped) in its log", "why": "The author's local run skipped it; CI is the only place it runs."}, {"item": "Decide whether `test-postgres` becomes a required check", "why": "Settles the 'can be ignored' risk."}, {"item": "Restart one deployment with its current `.env` after merge", "why": "The legacy URL mapping is unit-tested, not tested against a real deployment."}], "questions_for_author": ["Should the CI job use Python 3.15 to match the Docker image?", "Are there raw SQL queries outside the 9 PostgreSQL test files that pass parameters psycopg v3 might type differently?", "`docs/TESTING.md` mentions `TEST_DATABASE_URL`, but `make test-postgres` only reads `DATABASE_URL`. Which one should it be?"], "concepts": [{"term": "psycopg v3", "short": "The current PostgreSQL driver for Python, package `psycopg`.", "explain": "It replaces psycopg2. For this PR the difference that matters is that it sends parameters to the server separately from the SQL (server-side binding), so PostgreSQL checks their types strictly. It also leaves `cursor.lastrowid` empty; use `RETURNING id` instead.", "link": "https://www.psycopg.org/psycopg3/docs/basic/from_pg2.html"}, {"term": "SQLAlchemy dialect + driver", "short": "The `+name` part of a database URL picks the Python driver.", "explain": "`postgresql+psycopg://` means the PostgreSQL dialect through psycopg v3. Without `+name`, SQLAlchemy picks its default driver, and SQLAlchemy 2.1 changed that default from psycopg2 to psycopg v3, which caused #126."}, {"term": "CI service container", "short": "A database GitHub Actions starts next to the job.", "explain": "The `services:` block runs `postgres:15-alpine` for the job's duration, reachable on localhost:5432. The health check makes the job wait until PostgreSQL accepts connections."}], "quiz": [{"question": "A deployment's `.env` says `DATABASE_URL=postgresql+psycopg2://u:p@db/pv`. What happens after this PR?", "options": ["It crashes: psycopg2 is no longer installed", "It connects through psycopg v3", "It connects through psycopg2"], "answer": 1, "explain": "The legacy prefix matches `_PSYCOPG_REWRITE_RE` and `sqlalchemy_url` turns it into `postgresql+psycopg://`."}, {"question": "What does `pg_dump` receive for the same URL?", "options": ["`postgresql+psycopg://…`", "A plain `postgresql://…` URI", "Nothing: backups now go through SQLAlchemy"], "answer": 1, "explain": "`libpq_url` strips the driver suffix; libpq tools don't understand `+driver`."}, {"question": "You run `make test-postgres` with `DATABASE_URL` pointing at `promptvault_prod`. What happens?", "options": ["The schema is wiped", "The reset script refuses and make stops", "Tests run without a reset"], "answer": 1, "explain": "The reset script exits with code 2 when the database name doesn't contain `test`, and the loop stops on `|| exit 1`."}], "try_it": {"title": "What happens to your DATABASE_URL", "input_label": "DATABASE_URL in .env", "before_label": "Before this PR (psycopg2 pin)", "after_label": "After this PR", "rows": [{"input": "postgresql://u:p@db:5432/pv", "before": "postgresql+psycopg2://u:p@db:5432/pv", "after": "postgresql+psycopg://u:p@db:5432/pv", "note": "A bare URL gets an explicit driver in both versions; only the driver changes."}, {"input": "postgresql+psycopg2://u:p@db/pv", "before": "postgresql+psycopg2://u:p@db/pv", "after": "postgresql+psycopg://u:p@db/pv", "note": "The legacy form is rewritten, so existing `.env` files keep working after psycopg2 is removed."}, {"input": "postgresql+psycopg://u:p@db/pv", "before": "postgresql+psycopg://u:p@db/pv", "after": "postgresql+psycopg://u:p@db/pv", "note": "Already explicit: unchanged."}, {"input": "postgresql+asyncpg://u:p@db/pv", "before": "postgresql+asyncpg://u:p@db/pv", "after": "postgresql+asyncpg://u:p@db/pv", "note": "Names another driver: left alone."}, {"input": "sqlite:///./data/promptvault.db", "before": "sqlite:///./data/promptvault.db", "after": "sqlite:///./data/promptvault.db", "note": "Not PostgreSQL: untouched."}, {"input": "postgresql://u:postgresql%3A%2F%2F@db/pv", "before": "postgresql+psycopg2://u:postgresql%3A%2F%2F@db/pv", "after": "postgresql+psycopg://u:postgresql%3A%2F%2F@db/pv", "note": "The regex is anchored at the start, so scheme-like text in the password is kept."}]}}, "warnings": [], "generated_at": "2026-11-25 12:22 UTC"}</script>

    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    t = t.replace(/(^|[\s(])#(\d+)\b/g, (m, pre, n) => pre + '<a href="https://github.com/' + esc(PR.repo) + '/issues/' + n + '" target="_blank" rel="noopener">#' + n + "</a>");
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[+i] + "</code>");
  }
  function md(s) {
    if (!s) return "";
    const blocks = String(s).trim().split(/\n\s*\n/);
    return '<div class="md">' + blocks.map(b => {
      const lines = b.split("\n");
      if (lines.every(l => /^\s*[-*] /.test(l))) return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";

  }
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

  // ------------------------------------------------------------ word diff
  function tokens(s) { return s.match(/\s+|[A-Za-z0-9_]+|[^\sA-Za-z0-9_]/g) || []; }
  function wordDiff(a, b) {
    const x = tokens(a), y = tokens(b);
    if (x.length * y.length > 60000) return null;
    const m = x.length, n = y.length, dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
    for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
      dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const same = dp[0][0];
    const sig = (arr) => arr.filter(t => /\S/.test(t)).length || 1;
    if (same / Math.max(x.length, y.length, 1) < 0.5 || same < sig(x) / 3) return null;
    let i = 0, j = 0, oa = "", nb = "";
    while (i < m || j < n) {
      if (i < m && j < n && x[i] === y[j]) { oa += esc(x[i]); nb += esc(y[j]); i++; j++; }
      else if (j < n && (i >= m || dp[i][j + 1] >= dp[i + 1][j])) { nb += "<ins>" + esc(y[j]) + "</ins>"; j++; }
      else { oa += "<del>" + esc(x[i]) + "</del>"; i++; }
    }
    return [oa.replace(/<\/del><del>/g, ""), nb.replace(/<\/ins><ins>/g, "")];
  }
  const pairCache = new WeakMap();
  function hunkPairs(h) {
    if (pairCache.has(h)) return pairCache.get(h);
    const out = new Map(), L = h.lines;
    let i = 0;
    while (i < L.length) {
      if (L[i][0] !== "-") { i++; continue; }
      let d = i; while (d < L.length && L[d][0] === "-") d++;
      let a = d; while (a < L.length && L[a][0] === "+") a++;
      const nd = d - i, na = a - d;
      for (let k = 0; k < Math.min(nd, na); k++) {
        const r = wordDiff(L[i + k][3], L[d + k][3]);
        if (r) { out.set(i + k, r[0]); out.set(d + k, r[1]); }
      }
      i = a;
    }
    pairCache.set(h, out);
    return out;
  }

  // ------------------------------------------------------------ code rendering
  function inRange(line, ref) {
    if (!ref) return false;
    const n = ref.side === "old" ? line[1] : line[2];
    return n != null && n >= ref.start && n <= (ref.end == null ? ref.start : ref.end);
  }
  function lineHtml(h, idx, ref) {
    const l = h.lines[idx], t = l[0];
    const cls = (t === "+" ? "add" : t === "-" ? "del" : "ctx") + (inRange(l, ref) ? " hl" : "");
    const pairs = hunkPairs(h);
    const body = pairs.has(idx) ? pairs.get(idx) : esc(l[3]);
    return '<div class="ln ' + cls + '" data-o="' + (l[1] == null ? "" : l[1]) + '" data-n="' + (l[2] == null ? "" : l[2]) + '">' +
      '<span class="no o">' + (l[1] == null ? "" : l[1]) + '</span><span class="no">' + (l[2] == null ? "" : l[2]) + "</span>" +
      '<span class="sig">' + (t === " " ? "" : t === "-" ? "−" : "+") + "</span><code>" + (body || " ") + "</code></div>";
  }
  function fileCode(f, ref, opts) {
    opts = opts || {};
    let html = "";
    if (f.binary) return '<div class="gap-row">Binary file, not shown.</div>';
    if (!f.hunks.length) return '<div class="gap-row">No line changes (mode change or rename only).</div>';
    f.hunks.forEach((h, hi) => {
      let lo = 0, hiIdx = h.lines.length - 1;
      if (opts.excerpt) {
        const hit = h.lines.map((l, i) => inRange(l, ref) ? i : -1).filter(i => i >= 0);
        if (!hit.length) return;
        lo = Math.max(0, hit[0] - 2); hiIdx = Math.min(h.lines.length - 1, hit[hit.length - 1] + 2);
      } else {
        html += '<div class="hunk-head">@@ −' + h.old_start + " +" + h.new_start + (h.context ? " · " + esc(h.context) : "") + "</div>";
      }
      for (let i = lo; i <= hiIdx; i++) html += lineHtml(h, i, ref);
      if (opts.excerpt && hi < f.hunks.length - 1) html += "";
    });
    if (f.truncated && !opts.excerpt) html += '<div class="gap-row">Diff truncated here; the rest is on GitHub.</div>';

  }
  function refLabel(ref) {

  // ------------------------------------------------------------ chips

  function stat(v, l, n) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + l + "</div>" + (n ? '<div class="n">' + n + "</div>" : "") + "</div>"; }

      try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
    });
    updateChecks();
  }
  function updateChecks() {
    const checks = A.checklist || [], d = load("checklist", {});
    const n = checks.filter((_, i) => d[i]).length;
    if ($("#check-count")) { $("#check-count").textContent = n + " of " + checks.length + " checked"; $("#check-meter").style.width = (checks.length ? n / checks.length * 100 : 0) + "%"; }
    const ta = $("#notes"); if (!ta) return;
    const lines = [];
    const rec = REC[(A.verdict || {}).recommendation];
    if (rec) lines.push("**" + rec[1] + "**" + ((A.verdict || {}).headline ? ": " + A.verdict.headline : ""), "");
    if (checks.length) { lines.push("Checked before merge:"); checks.forEach((c, i) => lines.push("- [" + (d[i] ? "x" : " ") + "] " + c.item)); lines.push(""); }
    const qs = A.questions_for_author || [];
    if (qs.length) { lines.push("Questions:"); qs.forEach((q, i) => lines.push((i + 1) + ". " + q)); }
    ta.value = lines.join("\n").trim();
  }

  // ------------------------------------------------------------ learn tab
  function renderLearn() {
    const concepts = A.concepts || [], quiz = A.quiz || [], tryIt = A.try_it;
    let h = '<div class="narrow stack">';
    if (tryIt && (tryIt.rows || []).length) {
      const hasBefore = tryIt.rows.some(r => r.before != null);
      h += '<div class="card"><div class="section-head"><h2>' + inline(tryIt.title || "Try it") + '</h2><span class="mine">Worked out from the code by Claude</span></div>' +
        '<label class="small muted" for="try-in">' + esc(tryIt.input_label || "Input") + '</label><select id="try-in" class="try-select">' +
        tryIt.rows.map((r, i) => '<option value="' + i + '">' + esc(r.input) + "</option>").join("") + "</select>" +
        '<div class="try-out">' + (hasBefore ? '<div class="try-cell del"><div class="eyebrow">' + esc(tryIt.before_label || "Before") + '</div><code id="try-before"></code></div>' : "") +
        '<div class="try-cell add"><div class="eyebrow">' + esc(tryIt.after_label || "After") + '</div><code id="try-after"></code></div></div><div class="small muted" id="try-note"></div></div>';
    }
    if (concepts.length) {
      h += '<div><div class="section-head"><h2>Concepts in this PR</h2><span class="mine">Claude\'s analysis</span></div><div class="concepts">' +
        concepts.map(c => '<div class="card concept"><h3>' + esc(c.term) + '</h3><div class="short">' + inline(c.short || "") + "</div>" + md(c.explain) +
          (c.link ? '<div class="small" style="margin-top:8px"><a href="' + esc(c.link) + '" target="_blank" rel="noopener">Read more ↗</a></div>' : "") + "</div>").join("") + "</div></div>";
    }
    if (quiz.length) {
      h += '<div class="card"><div class="section-head"><h2>Check your understanding</h2><span class="score" id="quiz-score"></span></div><div class="stack" style="gap:22px">' +
        quiz.map((q, i) => '<div class="quiz-q" data-q="' + i + '"><div><strong>' + (i + 1) + ".</strong> " + inline(q.question) + '</div><div class="quiz-opts">' +
          (q.options || []).map((o, j) => '<button type="button" class="quiz-opt" data-j="' + j + '">' + inline(o) + "</button>").join("") +
          '</div><div class="quiz-explain" hidden>' + md(q.explain) + "</div></div>").join("") +
        '</div><div style="margin-top:14px"><button class="btn" id="quiz-reset" type="button">Start over</button></div></div>';
    }
    if (!concepts.length && !quiz.length && !(tryIt && (tryIt.rows || []).length)) h +='<div class="card muted">Nothing to learn here: the analysis has no concepts or quiz.</div>';
    h += "</div>";
    $("#tab-learn").innerHTML = h;
    const sel = $("#try-in");
    if (sel) {
      const show = () => {
        const r = tryIt.rows[+sel.value] || {};
        if ($("#try-before")) $("#try-before").textContent = r.before == null ? "(new behaviour)" : r.before;
        $("#try-after").textContent = r.after == null ? "" : r.after;
        $("#try-note").innerHTML = inline(r.note || "");
      };
      sel.addEventListener("change", show); show();
    }
    const answers = load("quiz", {});
    $$(".quiz-q").forEach(qel => {
      const i = +qel.dataset.q;
      if (answers[i] != null) markQuiz(qel, i, answers[i]);
      $$(".quiz-opt", qel).forEach(b => b.addEventListener("click", () => {
        const a = load("quiz", {}); a[i] = +b.dataset.j; save("quiz", a); markQuiz(qel, i, +b.dataset.j); quizScore();
      }));
    });
    const reset = $("#quiz-reset");
    if (reset) reset.addEventListener("click", () => { save("quiz", {}); renderLearn(); });
    quizScore();
  }
  function markQuiz(qel, i, j) {
    const right = (A.quiz[i] || {}).answer;
    $$(".quiz-opt", qel).forEach(b => { const k = +b.dataset.j; b.disabled = true; if (k === right) b.classList.add("right"); else if (k === j) b.classList.add("wrong"); });
    $(".quiz-explain", qel).hidden = false;
  }
  function quizScore() {
    const el = $("#quiz-score"); if (!el) return;
    const a = load("quiz", {}), q = A.quiz || [];
    const answered = Object.keys(a).length, right = Object.keys(a).filter(i => q[i] && q[i].answer === a[i]).length;
    el.textContent = answered ? right + " / " + answered + " right" : q.length + " questions";
  }

  // ------------------------------------------------------------ diff tab
  function renderDiff() {
    const notes = A.file_notes || {};
    const viewed = load("viewed", {});
    let rail = "", body = "";
    FILES.forEach((f, i) => {
      const startClosed = ["lockfile", "generated", "binary"].includes(f.category) || f.status === "removed" || (f.additions + f.deletions) > 600 || viewed[f.path];
      const short = f.path.length > 34 ? "…" + f.path.slice(-33) : f.path;
      rail += '<a href="#diff" data-file="' + i + '" class="' + (viewed[f.path] ? "viewed" : "") + '"><span class="p" title="' + esc(f.path) + '">' + esc(short) + "</span>" + nums(f) + "</a>";
      body += '<div class="file' + (startClosed ? "" : " open") + (viewed[f.path] ? " viewed" : "") + '" id="file-' + i + '" data-i="' + i + '">' +
        '<div class="file-head"><span class="tw">▸</span>' + statusChip(f) + '<span class="path">' + (f.old_path ? esc(f.old_path) + " → " : "") + esc(f.path) + "</span>" +
        chip("", f.category) + nums(f) + '<label class="viewed-box"><input type="checkbox" class="viewed-cb"' + (viewed[f.path] ? " checked" : "") + "> Viewed</label>" +
        '<a href="' + esc(f.github_url) + '" target="_blank" rel="noopener" class="small">GitHub ↗</a></div>' +
        (notes[f.path] ? '<div class="file-note">' + inline(notes[f.path]) + "</div>" : "") +
        '<div class="file-body"' + (startClosed ? " hidden" : "") + "></div></div>";
    });
    $("#tab-diff").innerHTML = '<div class="diff-layout"><nav class="rail" aria-label="Files">' + rail + '</nav><div><div class="toolbar"><button class="btn" id="exp-all" type="button">Expand all</button><button class="btn" id="col-all" type="button">Collapse all</button>' +
      '<span class="small muted">' + plural(FILES.length, "file") + ' · lockfiles, generated and viewed files start collapsed</span></div>' + body + "</div></div>";
    $$("#tab-diff .file").forEach(el => { if (el.classList.contains("open")) fillFile(el); });
    $$("#tab-diff .file-head").forEach(hd => hd.addEventListener("click", e => {
      if (e.target.closest("a, label, input")) return;
      toggleFile(hd.parentElement);
    }));
    $$("#tab-diff .viewed-cb").forEach(cb => cb.addEventListener("change", () => {
      const el = cb.closest(".file"), f = FILES[+el.dataset.i], v = load("viewed", {});
      v[f.path] = cb.checked; save("viewed", v);
      el.classList.toggle("viewed", cb.checked);
      $('.rail a[data-file="' + el.dataset.i + '"]').classList.toggle("viewed", cb.checked);
      if (cb.checked && el.classList.contains("open")) toggleFile(el, false);
    }));
    $$("#tab-diff .rail a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openFile(+a.dataset.file); }));
    $("#exp-all").addEventListener("click", () => $$("#tab-diff .file").forEach(el => toggleFile(el, true)));
    $("#col-all").addEventListener("click", () => $$("#tab-diff .file").forEach(el => toggleFile(el, false)));
  }
  function fillFile(el) { const b = $(".file-body", el); if (!b.dataset.filled) { b.innerHTML = fileCode(FILES[+el.dataset.i], null); b.dataset.filled = "1"; } }
  function toggleFile(el, open) {
    const want = open == null ? !el.classList.contains("open") : open;
    el.classList.toggle("open", want);
    $(".file-body", el).hidden = !want;
    if (want) fillFile(el);
  }
  function openFile(i, ref) {
    const el = $("#file-" + i); if (!el) return;
    toggleFile(el, true);
    let target = el;
    if (ref && ref.start != null) {
      const attr = ref.side === "old" ? "data-o" : "data-n";
      const end = ref.end == null ? ref.start : ref.end;
      const lines = $$(".ln", el).filter(l => { const n = l.getAttribute(attr); return n !== "" && +n >= ref.start && +n <= end; });
      lines.forEach(l => { l.classList.remove("flash"); void l.offsetWidth; l.classList.add("flash"); });
      if (lines[0]) target = lines[0];
    }
    target.scrollIntoView({ block: target === el ? "start" : "center" });
  }

  // ------------------------------------------------------------ references → diff
  document.addEventListener("click", e => {
    const a = e.target.closest(".reflink[data-ref]"); if (!a) return;
    e.preventDefault();
    let ref; try { ref = JSON.parse(a.dataset.ref); } catch (err) { return; }
    const i = FILES.findIndex(f => f.path === ref.file); if (i < 0) return;
    showTab("diff");
    requestAnimationFrame(() => openFile(i, ref));
  });

  // ------------------------------------------------------------ tabs + theme
  const TABS = ["summary", "walkthrough", "map", "risks", "learn", "diff"];
  const rendered = {};
  const RENDER = { summary: renderSummary, walkthrough: renderWalk, map: renderMap, risks: renderRisks, learn: renderLearn, diff: renderDiff };
  let currentTab = null;
  function showTab(name) {
    if (!TABS.includes(name)) name = "summary";
    if (!rendered[name]) { RENDER[name](); rendered[name] = true; }
    $$(".tab").forEach(s => { s.hidden = s.dataset.tab !== name; });
    $$("#tabs a").forEach(a => a.classList.toggle("active", a.dataset.tab === name));
    const changed = currentTab !== name;
    currentTab = name;
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
    if (changed) window.scrollTo(0, 0);
    if (name === "map") renderMermaid();
    if (name === "walkthrough") onScroll();
  }
  $$("#tabs a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); showTab(a.dataset.tab); }));
  window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));

  function applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    mermaidDone = false;
    if (rendered.map) { renderMap(); if (currentTab === "map") renderMermaid(); }
  }
  let theme = null; try { theme = localStorage.getItem("prg:theme"); } catch (e) { /* none */ }
  if (theme) document.documentElement.dataset.theme = theme;
  $("#theme-btn").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    try { localStorage.setItem("prg:theme", next); } catch (e) { /* none */ }
    applyTheme(next);
  });

  // keyboard: j/k move through walkthrough steps
  document.addEventListener("keydown", e => {
    if (currentTab !== "walkthrough" || e.target.closest("input, textarea") || e.metaKey || e.ctrlKey) return;
    const steps = $$(".step"); if (!steps.length) return;
    let i = activeStep;
    if (e.key === "j" || e.key === "ArrowDown" && e.altKey) i = Math.min(steps.length - 1, i + 1);
    else if (e.key === "k" || e.key === "ArrowUp" && e.altKey) i = Math.max(0, i - 1);
    else return;
    e.preventDefault(); setStep(i); steps[i].scrollIntoView({ block: "center" });
  });

  showTab(location.hash.slice(1) || "summary");
})();
</script>
</body>
</html>
